# FSM validator egress fragment (scripts/fsm/DESIGN.md §7).
# devcontainer/fsm-validate-entrypoint.sh sets
# CFGMS_SECURITY_REVIEW_HARNESS=validator before init-firewall.sh, so the
# validator container loads dnsmasq-allowlist-base.conf plus this file.
#
# Deliberately empty: the validator runs `make test-agent-complete` on a
# candidate tree and runs no model harness, so it resolves no model
# provider's domain. Everything the build and tests need (Go module proxy,
# npm registry, scanner databases) is in the base file.
