name: tooling-tests

# The tooling operates on a cfgms checkout, so each run checks out cfgms
# (develop, or the cfgms-ref input on a manual run) and mounts this commit at
# .claude/tooling, the same layout cfgms uses through its submodule.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      cfgms-ref:
        description: cfgms branch or SHA to test against (default develop)
        required: false
        default: develop

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.27.3'

jobs:
  tooling-tests:
    name: tooling-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out cfgms develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cfg-is/cfgms
          ref: ${{ inputs.cfgms-ref || 'develop' }}
          persist-credentials: false
          fetch-depth: 0

      - name: Check out this commit at .claude/tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .claude/tooling
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Install dnsmasq
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends dnsmasq

      - name: Run tooling test suite
        run: ./.claude/tooling/scripts/tests/run-tooling-tests.sh
